[package]
name = "settings"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "notch-settings"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = { version = "=0.5.1" }
places = { path = "../places" }
store = { path = "../store" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
salah = "0.7.6"
