[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "foldline-settings"
path = "src/main.rs"

[dependencies]
rust-i18n = "3"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = { version = "=0.5.1" }
places = { path = "../places" }
store = { path = "../store" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_System_WinRT", "Win32_Storage_Packaging_Appx", "ApplicationModel", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
salah = "0.7.6"
