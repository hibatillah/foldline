general.description:
  en: "Startup, your location, notifications, Windows popups and the focus timer."
  id: "Startup, lokasi, notifikasi, popup Windows, dan timer fokus."
general.group_startup:
  en: "Startup"
  id: "Startup"
general.start_with_windows:
  en: "Start with Windows"
  id: "Mulai bersama Windows"
general.start_with_windows_note:
  en: "Starts the notch when you sign in."
  id: "Menjalankan notch saat masuk ke Windows."
general.hide_when_idle:
  en: "Hide when idle"
  id: "Sembunyikan saat diam"
general.hide_when_idle_note:
  en: "Hides the notch when nothing is happening. Point at the top edge to bring it back."
  id: "Menyembunyikan notch saat tidak ada aktivitas. Arahkan kursor ke tepi atas untuk memunculkannya lagi."
general.group_location:
  en: "Location"
  id: "Lokasi"
general.track_location:
  en: "Track location"
  id: "Lacak lokasi"
general.track_location_note:
  en: "The city changes by itself when the device moves to another one. Needs Windows location access (Settings > Privacy & security > Location). Turn off to keep the city chosen below."
  id: "Kota berubah sendiri saat perangkat pindah ke kota lain. Perlu akses lokasi Windows (Pengaturan > Privasi & keamanan > Lokasi). Matikan agar kota yang dipilih di bawah tetap."
general.city:
  en: "City"
  id: "Kota"
general.city_note:
  en: "The one place for the prayer times and the weather."
  id: "Satu lokasi untuk jadwal shalat dan cuaca."
general.group_notifications:
  en: "Notifications"
  id: "Notifikasi"
general.show_notifications:
  en: "Show notifications"
  id: "Tampilkan notifikasi"
general.show_notifications_note:
  en: "Shows a banner when Windows shows a notification. To keep Windows' own banner away, turn on \"Hide Windows notification banners\" under Windows popups."
  id: "Menampilkan banner saat Windows menampilkan notifikasi. Untuk menyembunyikan banner bawaan Windows, aktifkan \"Sembunyikan banner notifikasi Windows\" di bagian Popup Windows."
general.show_notification_text:
  en: "Show notification text"
  id: "Tampilkan isi notifikasi"
general.show_notification_text_note:
  en: "Shows the message in the banner. Without it, the banner reads \"New message\"."
  id: "Menampilkan isi pesan di banner. Tanpa ini, banner hanya bertuliskan \"Pesan baru\"."
general.device_battery:
  en: "Warn when a device battery is low"
  id: "Peringatkan saat baterai perangkat lemah"
general.device_battery_note:
  en: "Shows a message when a connected Bluetooth device reaches 20 % or 10 %."
  id: "Menampilkan pesan saat baterai perangkat Bluetooth yang terhubung mencapai 20 % atau 10 %."
general.group_windows_popups:
  en: "Windows popups"
  id: "Popup Windows"
general.hide_volume_popup:
  en: "Hide the Windows volume and brightness popups"
  id: "Sembunyikan popup volume dan kecerahan Windows"
general.hide_volume_popup_note:
  en: "Keeps the volume and brightness boxes Windows shows above the taskbar away while the notch runs, so only the notch shows them. They come back when the notch closes."
  id: "Menyembunyikan kotak volume dan kecerahan yang ditampilkan Windows di atas taskbar selama notch berjalan, sehingga hanya notch yang menampilkannya. Kotak itu kembali saat notch ditutup."
general.hide_banners:
  en: "Hide Windows notification banners"
  id: "Sembunyikan banner notifikasi Windows"
general.hide_banners_note:
  en: "Turns off the banner Windows shows at the bottom right for every app while the notch runs, so only the notch shows notifications; they stay in the notification center. Each app's own choice comes back when this is off or the notch closes."
  id: "Mematikan banner yang ditampilkan Windows di kanan bawah untuk semua aplikasi selama notch berjalan, sehingga hanya notch yang menampilkan notifikasi; notifikasi tetap ada di pusat notifikasi. Pilihan tiap aplikasi kembali saat ini dimatikan atau notch ditutup."
general.group_timer:
  en: "Timer"
  id: "Timer"
general.focus_minutes:
  en: "Focus (minutes)"
  id: "Fokus (menit)"
general.focus_minutes_note:
  en: "Length of a focus session, 5 to 120."
  id: "Lama satu sesi fokus, 5 sampai 120."
general.short_break_minutes:
  en: "Short break (minutes)"
  id: "Istirahat singkat (menit)"
general.short_break_note:
  en: "Rest after a focus session, 1 to 120."
  id: "Istirahat setelah sesi fokus, 1 sampai 120."
general.long_break_minutes:
  en: "Long break (minutes)"
  id: "Istirahat panjang (menit)"
general.long_break_note:
  en: "Longer rest after several sessions, 1 to 120."
  id: "Istirahat lebih lama setelah beberapa sesi, 1 sampai 120."
pages.desc_media:
  en: "Music player with synced lyrics."
  id: "Pemutar musik dengan lirik yang sinkron."
pages.desc_shelf:
  en: "Holds dropped files for a while."
  id: "Menyimpan file yang dijatuhkan untuk sementara."
pages.desc_calendar:
  en: "The month or the week, and the events of a day you pick."
  id: "Bulan atau pekan, dan acara pada hari yang dipilih."
pages.desc_timer:
  en: "Focus and break timer."
  id: "Timer fokus dan istirahat."
pages.desc_stats:
  en: "System stats, off until you switch it on."
  id: "Statistik sistem, mati sampai dinyalakan."
pages.desc_clipboard:
  en: "History of the last 7 copies with a preview, paste and copy buttons. Kept in memory only and cleared when the app quits."
  id: "Riwayat 7 salinan terakhir dengan pratinjau, tombol tempel dan salin. Hanya disimpan di memori dan dihapus saat aplikasi ditutup."
pages.not_reported:
  en: "The notch has not reported its pages yet. Start the notch once, then reopen this window."
  id: "Notch belum melaporkan halamannya. Jalankan notch sekali, lalu buka jendela ini lagi."
pages.description:
  en: "Choose which pages the notch shows and drag them into your order. At least one stays on."
  id: "Pilih halaman yang ditampilkan notch dan seret ke urutan yang diinginkan. Minimal satu halaman tetap menyala."
behavior.level0:
  en: "0 · Hidden"
  id: "0 · Tersembunyi"
behavior.level0_note:
  en: "Nothing is drawn. Not even messages."
  id: "Tidak ada yang digambar. Pesan pun tidak."
behavior.level1:
  en: "1 · Activities"
  id: "1 · Aktivitas"
behavior.level1_note:
  en: "On-demand messages only, such as volume. Then it hides again."
  id: "Hanya pesan sesuai kebutuhan, seperti volume. Lalu bersembunyi lagi."
behavior.level2:
  en: "2 · Lyrics"
  id: "2 · Lirik"
behavior.level2_note:
  en: "Lyrics while they play, plus everything from level 1."
  id: "Lirik selagi diputar, ditambah semua dari level 1."
behavior.level3:
  en: "3 · Always visible"
  id: "3 · Selalu terlihat"
behavior.level3_note:
  en: "The idle pill with clock and battery, plus everything from levels 1 and 2."
  id: "Pill saat diam dengan jam dan baterai, ditambah semua dari level 1 dan 2."
behavior.intro:
  en: "Behavior works like a log level. You pick how much the notch is allowed to show, and every level also shows everything below it. Level 2 does not mean lyrics only: it shows lyrics and messages. Level 3 shows all of it."
  id: "Perilaku bekerja seperti level log. Pilih seberapa banyak yang boleh ditampilkan notch, dan setiap level juga menampilkan semua level di bawahnya. Level 2 bukan hanya lirik: isinya lirik dan pesan. Level 3 menampilkan semuanya."
behavior.column_messages:
