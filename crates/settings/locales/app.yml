  id: "Hanya pekan ini, pada halaman yang lebih pendek."
calendar.google_step1:
  en: "Open calendar.google.com on a computer."
  id: "Buka calendar.google.com di komputer."
calendar.google_step2:
  en: "Click the gear icon at the top right, then Settings."
  id: "Klik ikon roda gigi di kanan atas, lalu Setelan."
calendar.google_step3:
  en: "Under \"Settings for my calendars\" on the left, click the calendar to show."
  id: "Di bawah \"Setelan untuk kalender saya\" di sebelah kiri, klik kalender yang ingin ditampilkan."
calendar.google_step4:
  en: "Click Integrate calendar."
  id: "Klik Integrasikan kalender."
calendar.google_step5:
  en: "Copy the link under \"Secret address in iCal format\" and paste it into the Calendar address field."
  id: "Salin tautan di bawah \"Alamat rahasia dalam format iCal\" lalu tempel ke kolom Alamat kalender."
calendar.google_note1:
  en: "The secret address lets anyone who has it read the whole calendar. Keep it to yourself; Reset in the same section replaces it."
  id: "Alamat rahasia memungkinkan siapa pun yang memilikinya membaca seluruh kalender. Simpan sendiri; Reset di bagian yang sama menggantinya."
calendar.google_note2:
  en: "A work or school account may hide the address when the admin limits sharing. Ask the admin in that case."
  id: "Akun kerja atau sekolah mungkin menyembunyikan alamat ini saat admin membatasi berbagi. Tanyakan ke admin jika begitu."
