shalat.adjust_description:
  en: "Add or subtract minutes, from −30 to 30, to match your local mosque. The dots show where each prayer falls in the day."
  id: "Tambah atau kurangi menit, dari −30 sampai 30, agar sesuai dengan masjid setempat. Titik menunjukkan letak tiap waktu shalat dalam sehari."
