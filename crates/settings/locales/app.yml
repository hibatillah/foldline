  id: "Buka saat kursor diarahkan"
behavior.description:
  en: "Choose what the notch shows, as a level, while a maximized or full-screen window is in front of it."
  id: "Pilih apa yang ditampilkan notch, sebagai level, saat jendela yang dimaksimalkan atau layar penuh ada di depannya."
behavior.group_levels:
  en: "Levels"
  id: "Level"
behavior.over_maximized:
  en: "Over a maximized window"
  id: "Di atas jendela yang dimaksimalkan"
