[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/notch"]
exclude = ["vendor/salah"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
publish = false
rust-version = "1.88"

[patch.crates-io]
salah = { path = "vendor/salah" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
