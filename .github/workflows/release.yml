name: Release

# Runs only when a version tag such as v0.1.0 or v0.5.0-alpha.1 is pushed. It checks the code, builds it and publishes a GitHub release (a pre-release when the tag has a suffix).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          # A suffix after the version (v0.5.0-alpha.1) marks a pre-release; the crate version stays plain (0.5.0).
          # Every crate inherits its version from the workspace in Cargo.toml.
          tag_version="${GITHUB_REF_NAME%%-*}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          # The settings crate (GPUI) builds only with the MSVC host toolchain.
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc

      - name: Check
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        shell: bash
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          name=$(grep -m1 '^name' crates/notch/Cargo.toml | cut -d'"' -f2)
          settings_name=$(grep -A3 '^\[\[bin\]\]' crates/settings/Cargo.toml | grep -m1 '^name' | cut -d'"' -f2)
          release_directory="$PWD/target/x86_64-pc-windows-msvc/release"
          # The installer shows the whole tag version, so a tester sees 0.5.0-alpha.1 and not 0.5.0.
          version="${GITHUB_REF_NAME#v}"
          installer="$name-$GITHUB_REF_NAME-windows-x64-setup"
          mkdir -p dist
          choco install innosetup --no-progress -y
          # The slashes of the compiler's options must not be taken for paths.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$version" "/DExeName=$name.exe" \
            "/DSourceExe=$(cygpath -w "$release_directory/$name.exe")" \
            "/DSettingsExeName=$settings_name.exe" \
            "/DSourceSettingsExe=$(cygpath -w "$release_directory/$settings_name.exe")" \
            "/O$(cygpath -w "$PWD/dist")" "/F$installer" installer/notch.iss
          (cd dist && sha256sum "$installer.exe" > "$installer.exe.sha256")
          echo "INSTALLER=$installer.exe" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in *-*) prerelease_flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease_flag \
            "dist/$INSTALLER" "dist/$INSTALLER.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
