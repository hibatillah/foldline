name: Website

# Runs on pull requests into master that touch the website: type check, format, lint and a production build.
# The Rust workspace has its own check in ci.yml.
on:
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version is the packageManager field of website/package.json.
          bun-version-file: website/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
