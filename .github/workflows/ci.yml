name: CI

# Runs on pull requests into master and is the check a pull request must pass to merge (make "Check" a required status
# check in the branch protection of master). Pushes to master and tags do not run it; a tag runs the release workflow.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          # The settings crate (GPUI) builds only with the MSVC host toolchain.
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc

      - name: Check
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  label:
    name: Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The release notes group pull requests by their `type:` label; it comes from the title's `type(scope):` prefix.
      - name: Label the pull request from its title
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          type="$(printf '%s' "$TITLE" | sed -nE 's/^(feat|fix|perf|refactor|docs|test|style|ci|build|chore)(\([^)]*\))?(!)?:.*/\1\3/p')"
          case "$type" in
            "") echo "The title does not start with type(scope): so it gets no type label." >&2; exit 0 ;;
            *!) label="type: breaking" ;;
            *) label="type: $type" ;;
          esac
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --force >/dev/null
          for old in $(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name | select(startswith("type: "))' | tr ' ' '_'); do
            gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$(printf '%s' "$old" | tr '_' ' ')" || true
          done
          gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"
